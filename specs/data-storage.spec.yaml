  last_implementation_branch: ""
  last_pr_url: ""
  last_pr_merged: ""
  last_version_tag: ""

tasks:
  - id: DATA-TASK-001
    description: |
      Restore setObject(key, value) and deleteContent(key) exports in _gg_data/handler/gg_database.js.
      Fixes critical regression where single-object state (such as current_gear_state in QoL.js and
      conflict states in GuildConflicts.js) was corrupted by setContent treating all inputs as arrays.
    affects: "_gg_data/handler/gg_database.js"
    depends_on: []
    source: "AC-DATA-003, AC-DATA-004"
    status: DONE

  - id: DATA-TASK-002
    description: |
      Reconcile master game database data from backup/_sws_data/database/sws_data.db (19MB) into
      _gg_data/database/gg_data.db. Verify items, creatures, and realms are populated so scrapers
      do not encounter empty tables.
    affects: "_gg_data/database/gg_data.db, scripts/populate_db.mjs"
    depends_on: ["DATA-TASK-001"]
    source: "entities"
    status: DONE
    evidence: "scripts/reconciliation/import-legacy-db.mjs, reconciliation/import-reports/import-2026-09-24T18-13-54-046Z.json"

  - id: DATA-TASK-003
    description: |
      Build automated test suite for database operations, migrations runner, LRU cache layer,
      and FIFO/single-object state management.
    affects: "tests/data-storage/operations.test.mjs, _gg_data/handler/gg_database.js"
    depends_on: ["DATA-TASK-001"]
    source: "acceptance_criteria"
    status: DONE

  - id: DATA-TASK-004
    description: |
      Async MySQL data layer: _gg_data/handler/mysqlClient.js (mysql2 pool, query, transaction),
      async gg_database.js (initDatabase, closeDatabase, getConnection), async migrationRunner.js
      (statement by statement, once per process), MySQL-dialect migrations, and GG_MYSQL_* registry
      settings replacing GG_DB_DIR/GG_DB_PATH.
    affects: "_gg_data/handler/mysqlClient.js, _gg_data/handler/gg_database.js, _gg_data/handler/migrationRunner.js, _gg_data/migrations/*.sql, config/registry.mjs, package.json"
    depends_on: []
    source: "AC-DATA-001, AC-DATA-002, AC-DATA-003, AC-DATA-004, AC-DATA-005, AC-DATA-007"
    status: DONE
    evidence: "_gg_data/handler/mysqlClient.js, _gg_data/handler/gg_database.js, _gg_data/handler/migrationRunner.js, _gg_data/migrations/*.sql, config/registry.mjs"

  - id: DATA-TASK-005
    description: |
      In-process mysql2 fake over node:sqlite, installed by the npm test preload unless
      GG_TEST_MYSQL_URL is set; port tests/data-storage/* to it.
    affects: "tests/helpers/fake-mysql.mjs, tests/helpers/test-database.mjs, tests/data-storage/*.test.mjs, package.json"
    depends_on: ["DATA-TASK-004"]
    source: "AC-DATA-008"
    status: DONE
    evidence: "tests/helpers/fake-mysql.mjs, tests/helpers/test-database.mjs, tests/helpers/db-client.mjs, tests/data-storage/*.test.mjs (29 tests)"

  - id: DATA-TASK-006
    description: |
      Await the data layer in every caller: app_modules/*, discord_modules/gvg.js, healthCheck.mjs,
      app.mjs (initDatabase before login; exit 1 when MySQL is unavailable); update their tests.
      metrics.mjs reads only in-memory cache stats and stays synchronous. The pool is not closed on
      SIGTERM: the engine drain window may still be writing, and process exit drops the sockets.
    affects: "app_modules/*.js, discord_modules/gvg.js, healthCheck.mjs, metrics.mjs, app.mjs, tests/**"
    depends_on: ["DATA-TASK-005"]
    source: "AC-DATA-002, AC-DATA-003, AC-DATA-004, AC-DATA-005, AC-DATA-007"
    status: DONE
    evidence: "app_modules/*.js, discord_modules/gvg.js, healthCheck.mjs, app.mjs, tests/control-plane/boot-fail-closed.test.mjs"

  - id: DATA-TASK-007
    description: |
      Async controlStore on the MySQL client; the control-plane bootstrap, server, and account
      switcher await it; rotate-key re-seals in one MySQL transaction (no SQLite snapshot).
    affects: "_gg_data/handler/controlStore.js, control-plane/*.mjs, scripts/control-plane/*.mjs, tests/control-plane/*.test.mjs"
    depends_on: ["DATA-TASK-005"]
    source: "AC-DATA-007; control-plane AC-CTRL-003, AC-CTRL-004"
    status: DONE
    evidence: "_gg_data/handler/controlStore.js, control-plane/*.mjs, scripts/control-plane/rotate-key.mjs, tests/control-plane/store.test.mjs"

  - id: DATA-TASK-008
    description: |
      compose.yaml mysql:8.4 service (private network, named volume, healthcheck, no published
      port); gogon depends_on mysql healthy; drop the SQLite volume; regenerate .env.example.
    affects: "compose.yaml, Dockerfile, .env.example, tests/control-plane/docker.test.mjs"
    depends_on: ["DATA-TASK-004"]
    source: "AC-DATA-007; owner decision 2026-09-24"
    status: DONE
    evidence: "compose.yaml, Dockerfile, .env.example, docs/deployment.md, tests/control-plane/docker.test.mjs"

  - id: DATA-TASK-009
    description: |
      GitHub Actions CI on tracked code only: Node 22 test suite (fake), data-layer and
      control-store tests against a MySQL 8.4 service (GG_TEST_MYSQL_URL), and a Docker image
      build plus a compose config check. No reconciliation and no backup/ access (owner decision).
    affects: ".github/workflows/ci.yml"
    depends_on: ["DATA-TASK-005", "DATA-TASK-008"]
    source: "AC-DATA-008; owner decision 2026-09-24 (CI tests live code)"
    status: DONE
    evidence: ".github/workflows/ci.yml (not yet run: no pushed remote branch)"

  - id: DATA-TASK-010
    description: |
      Retire SQLite from the live path: remove better-sqlite3, backupDatabase(), and the SQLite
      import tool with its snapshot workflow; port scripts/populate_db.mjs to the async API.
    affects: "package.json, scripts/populate_db.mjs, scripts/reconciliation/import-legacy-db.mjs, tests/reconciliation/import-legacy-db.test.mjs"
    depends_on: ["DATA-TASK-006", "DATA-TASK-007"]
    source: "AC-DATA-006 retired; owner decision 2026-09-24 (SQLite disposable)"
    status: DONE
    progress: "populate_db.mjs uses the async MySQL API and replaces only master tables in one transaction. The retired SQLite import tool was deleted and its test removed after the owner confirmed legacy SQLite data is disposable. better-sqlite3 is no longer a project dependency."
