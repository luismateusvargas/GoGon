tasks:
  - id: CAT-TASK-001
    description: |
      Document the source-backed read contracts before production collection. game_modules/API.js
      already defines JSON current-location and world-map reads; the supplied reconciliation/scrappers
      scripts define guide index/detail URLs and parser fields for items, creatures, realms, and master
      realms. Record these request/response shapes, allowed fields, and challenge/error classifications
      as fixtures. Validate a separate game creature-detail or item-detail read only before enabling
      those optional game-side frontiers; do not make that capture a prerequisite for guide discovery
      or current-location identity collection. Confirm guide index order from valid browser responses;
      until then, plan full index sweeps. Record separate guide minimum delay, per-execution request
      budget, daily cap, expected full-sweep page count/duration, and checkpoint schedule before any
      scheduled guide run. Keep game and guide request policies separate.
    affects: "catalog/contracts/, tests/catalog-sync/fixtures/, game_modules/API.js, reconciliation/scrappers/, docs/catalog-sync-control-plane-plan.md"
    depends_on: []
    source: "AC-CAT-001, AC-CAT-002, AC-CAT-003, AC-CAT-004"
    status: IN_PROGRESS
    progress: "2026-09-28: guide URL/order/parser contract, response classification, separate game and guide policies (DEC-CAT-017/018), synthetic fixtures, tests/catalog-sync/contracts.test.mjs. Open: one owner-captured, redacted fetchLocation response and its field mapping (DEC-CAT-019); game creature/item detail reads do not exist."

