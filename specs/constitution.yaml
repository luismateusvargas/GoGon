constitution:
  id: gogon-constitution
  status: draft
  version: "0.1.0"
  project_ref: specs/project.yaml
  scope: Single-owner GoGon deployment that monitors FallenSword, delivers Discord alerts, and exposes a private control plane and catalog workflow.
  rules:
    - id: RULE-001
      statement: Preserve observable contracts in the existing domain acceptance criteria unless an owner-approved revision explicitly changes them.
      rationale: Alerts, game actions, and dashboard controls share state and depend on established behavior.
      applies_to: All runtime and domain changes.
      verification: Review changed criteria against the prior spec version and affected tests.
    - id: RULE-002
      statement: Keep secrets, cookies, credentials, webhook URLs, and raw sensitive game or Discord payloads out of API responses, logs, and metrics.
      rationale: The owner control plane stores credentials and webhook secrets.
      applies_to: Control plane, session, Discord delivery, telemetry, and catalog.
      verification: Run redaction and authorization tests; inspect new log fields.
    - id: RULE-003
      statement: Keep owner APIs authenticated with session and CSRF checks and keep the dashboard bound to host loopback in Compose.
      rationale: The owner dashboard changes game account and notification behavior.
      applies_to: Control plane and deployment.
      verification: Run control plane tests and check Compose port binding.
    - id: RULE-004
      statement: Keep scheduled game monitors non-overlapping and preserve their persisted enablement and intervals.
      rationale: Duplicate polling and notifications can cause game load and noisy alerts.
      applies_to: Task engine and monitors.
      verification: Run task engine lifecycle and scheduling tests.
    - id: RULE-005
      statement: Database changes use ordered, repeatable MySQL migrations; CI verifies data behavior against a fake and MySQL 8.4.
      rationale: MySQL is the persistent state store in production.
      applies_to: Data and catalog changes.
      verification: Run data tests and the MySQL CI job.
  logging:
    info: "Use the existing LOG(feature, message) for meaningful startup, module transition, completed delivery, and recovery events with safe module or channel key, outcome, timestamp, and duration. LOG is currently controlled by GG_DEBUG, so required operational INFO visibility is a verified gap."
    warning: "Use WARN for retries, timeout, stale progress, rate limits, disabled dependencies, and recoverable failures; include operation, sanitized destination key, attempt, HTTP status when known, and bounded delay."
    error: "Use ERR for failed delivery after bounded retries, monitor failures, and failed account or database operations; include sanitized operation, category, module, and duration without URL or payload."
    debug: "Use LOG for detailed diagnostic state only while GG_DEBUG is enabled by the owner; include sanitized task and queue state, not raw responses or account content. GG_DEBUG is currently enabled by default in config/registry.mjs; a later change may separate INFO from DEBUG."
    safeguards: "Use app_modules/core.js LOG/WARN/ERR and Compose local log rotation. Never print tokens, webhook URLs, credentials, cookie jars, raw payloads, or sensitive HTML; bound repetitive messages."
    coverage_gaps:
      - Discord queue has no request deadline or stalled-head warning; utils.js processQueue can remain pending silently.
      - metrics.mjs defines Discord counters but no runtime code calls incrementMetric.
      - healthCheck.mjs does not assess last delivery progress or overdue task runs.
  quality_gates:
    - id: GATE-001
      check: npm test on Node 22 with no-network fixtures
      expected_result: All affected tests pass without real FallenSword or Discord calls.
    - id: GATE-002
      check: MySQL 8.4 CI test job for data, catalog, control plane, monitors, and relevant Discord behavior
      expected_result: Tests pass against the production database family.
    - id: GATE-003
      check: docker compose config --quiet and production image build
      expected_result: Valid private deployment image and Compose configuration.
    - id: GATE-004
      check: Review changed contracts, redaction, and recovery behavior
      expected_result: Acceptance criteria map to tests and safe operator checks.
  change_policy:
    approver: GoGon owner
    revision_process: "Record changed rule or contract with provenance and version bump in its YAML definition; review affected tests before adoption."
  evidence:
    - specs/*.spec.yaml (existing domain contracts and recorded owner decisions)
    - app_modules/core.js (current logging implementation)
    - config/registry.mjs (GG_DEBUG default and settings)
    - .github/workflows/ci.yml (CI gates)
    - compose.yaml (deployment boundaries and log rotation)
    - utils.js (delivery and logging gaps)
    - metrics.mjs (defined counters)
    - healthCheck.mjs (current health contract)
  open_decisions: []
